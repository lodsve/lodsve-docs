<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Lodsve project architecture</title>
<desc id="diagram-description">Maven Archetype and Gradle Archetype Plugin provide application templates; Business applications choose Lodsve Boot Starter; MongoDB Starter supports named data sources through automatic configuration and dynamic client components; Maven Plugins extend source code generation and resource packaging; Boot internally consists of automatic configuration, components, core modules and optional Actuator; examples are used for verification; Hugo documentation station is published to GitHub Pages.</desc>
