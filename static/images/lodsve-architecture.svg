<text x="80" y="190" class="section">01  工程生成</text>
<rect x="80" y="220" width="400" height="190" rx="14" fill="#ffffff" stroke="#9ab8a9" stroke-width="2" />
<text x="105" y="258" class="card-title">Maven Archetype</text>
<text x="105" y="292" class="body">6 个 Lodsve Boot 工程模板</text>
<text x="105" y="322" class="small">Quickstart · MyBatis · Nacos</text>
<text x="105" y="350" class="small">RPC API · Server · Client</text>
<text x="105" y="385" class="small">输出 Maven POM、源码与配置</text>
<rect x="80" y="435" width="400" height="190" rx="14" fill="#ffffff" stroke="#9ab8a9" stroke-width="2" />
<text x="105" y="473" class="card-title">Gradle Archetype Plugin</text>
<text x="105" y="507" class="body">读取用户维护的本地模板</text>
<text x="105" y="537" class="small">替换文件内容和路径变量</text>
<text x="105" y="565" class="small">不内置应用模板；可生成 Boot 应用</text>
<text x="105" y="600" class="small">输出到模板工程的 generated/ 目录</text>
<rect x="80" y="655" width="400" height="110" rx="12" fill="#e7eff9" stroke="#bdcce0" stroke-width="1.5" />
<text x="105" y="692" class="card-title">生成器职责</text>
<text x="105" y="724" class="small">准备工程骨架；应用依赖由生成结果决定</text>
<text x="548" y="243" class="tiny" text-anchor="middle" fill="#3d8069">生成</text>
<text x="535" y="303" class="tiny" text-anchor="middle" fill="#3d8069">生成</text>
<rect x="580" y="205" width="500" height="140" rx="16" fill="#ffffff" stroke="#7695cf" stroke-width="2.5" />
<text x="830" y="250" class="card-title" text-anchor="middle">业务应用</text>
<text x="830" y="282" class="body" text-anchor="middle">由脚手架生成或自行创建</text>
<text x="830" y="314" class="small" text-anchor="middle">选择所需 Starter，加入业务代码</text>
<text x="851" y="375" class="tiny" fill="#5473ad">按需依赖</text>
<text x="1200" y="190" class="section">03  Maven 构建扩展</text>
<rect x="1195" y="215" width="190" height="130" rx="13" fill="#ffffff" stroke="#d0ad76" stroke-width="2" />
<text x="1215" y="253" class="card-title">JavaTemplate</text>
<text x="1215" y="285" class="small">generate-sources</text>
<text x="1215" y="312" class="small">generate-test-sources</text>
<rect x="1405" y="215" width="190" height="130" rx="13" fill="#ffffff" stroke="#d0ad76" stroke-width="2" />
<text x="1425" y="253" class="card-title">Shade</text>
<text x="1425" y="285" class="small">资源 Transformer</text>
<text x="1425" y="312" class="small">Spring 元数据合并</text>
<rect x="1195" y="380" width="400" height="110" rx="13" fill="#fffaf2" stroke="#d0ad76" stroke-width="2" />
<text x="1220" y="415" class="card-title">Maven 生命周期</text>
<text x="1220" y="447" class="small">generate-sources → compile → package</text>
<text x="1220" y="475" class="tiny">Boot 源码构建配置 JavaTemplate；插件不进入运行时</text>
<text x="540" y="470" class="section">02  Lodsve Boot · 应用运行时</text>
<text x="1120" y="470" class="badge" text-anchor="end" fill="#5273ad">组件可组合</text>
<rect x="535" y="500" width="270" height="75" rx="12" fill="#ffffff" stroke="#c2cede" stroke-width="2" />
<text x="670" y="531" class="body" text-anchor="middle">Parent + Dependencies</text>
<text x="670" y="557" class="tiny" text-anchor="middle">构建约定与版本管理</text>
<rect x="650" y="615" width="370" height="65" rx="12" fill="#e0eaff" stroke="#7695cf" stroke-width="2" />
<text x="835" y="643" class="card-title" text-anchor="middle">Starter</text>
<text x="835" y="666" class="tiny" text-anchor="middle">应用侧依赖入口</text>
<rect x="535" y="720" width="280" height="78" rx="12" fill="#ffffff" stroke="#aebed6" stroke-width="2" />
<text x="675" y="751" class="card-title" text-anchor="middle">AutoConfiguration</text>
<text x="675" y="778" class="tiny" text-anchor="middle">imports + 条件化 Bean 注册</text>
<rect x="855" y="720" width="280" height="78" rx="12" fill="#ffffff" stroke="#aebed6" stroke-width="2" />
<text x="995" y="751" class="card-title" text-anchor="middle">Components</text>
<text x="995" y="778" class="tiny" text-anchor="middle">可复用功能实现与适配器</text>

<rect x="650" y="830" width="370" height="55" rx="12" fill="#e8eef5" stroke="#aebdce" stroke-width="2" />
<text x="835" y="864" class="small" text-anchor="middle">lodsve-boot · 共用基础类型与工具</text>
<rect x="585" y="900" width="500" height="48" rx="11" fill="#f1f6fa" stroke="#aebdce" stroke-width="2" />
<text x="835" y="930" class="small" text-anchor="middle">Spring Boot / Spring Cloud + 数据库、Redis、消息、对象存储</text>


<text x="1200" y="595" class="section">04  扩展与验证</text>
<rect x="1195" y="620" width="400" height="130" rx="13" fill="#ffffff" stroke="#c7bddf" stroke-width="2" />
<text x="1220" y="658" class="card-title">Actuator 扩展</text>
<text x="1220" y="690" class="small">actuator + actuator-autoconfigure</text>
<text x="1220" y="722" class="tiny">Versions · Dependencies · Enums endpoints</text>
<rect x="1195" y="775" width="400" height="130" rx="13" fill="#ffffff" stroke="#c7bddf" stroke-width="2" />
<text x="1220" y="813" class="card-title">lodsve-boot-examples</text>
<text x="1220" y="845" class="small">Maven include-examples 可选聚合</text>
<text x="1220" y="877" class="tiny">以独立应用验证 Starter 与基础设施用法</text>
