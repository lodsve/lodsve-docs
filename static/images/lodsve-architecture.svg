<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Lodsve 工程整体技术架构</title>
<desc id="diagram-description">Maven Archetype 和 Gradle Archetype Plugin 生成应用；业务应用选择 Lodsve Boot Starter；Maven Plugins 扩展源码生成和资源打包；Boot 内部由自动配置、组件、核心模块和可选 Actuator 组成；examples 用于验证；Hugo 文档站发布到 GitHub Pages。</desc>
<defs>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#5473ad" /></marker>
<marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#3d8069" /></marker>
<marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b47b31" /></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.title{font-size:34px;font-weight:750}.subtitle{font-size:18px;fill:#607188}.section{font-size:16px;font-weight:750;letter-spacing:1px;fill:#61738b}.card-title{font-size:22px;font-weight:700}.body{font-size:18px;fill:#3d4f66}.small{font-size:16px;fill:#596b80}.tiny{font-size:14px;fill:#66778c}.column-title{font-size:21px;font-weight:700}.row-text{font-size:18px;fill:#33465c}.badge{font-size:14px;font-weight:700;letter-spacing:.4px}</style>
</defs>
<rect width="1680" height="1080" fill="#f5f8fc" />
