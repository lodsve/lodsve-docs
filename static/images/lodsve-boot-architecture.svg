<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1960" viewBox="0 0 1600 1960" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Lodsve Boot 堆叠式组件架构图</title>
<desc id="diagram-description">图按应用层、Starter 层、公共自动配置层、Component 与外部集成层、Core 和基础设施从上至下堆叠。四组能力卡片分别映射 Web API、数据存储、消息事件、云与运行时功能；数据存储组包含 MongoDB Starter、具名数据源自动配置和动态客户端 Component。版本管理、示例工程和 Actuator 作为辅助模块呈现。</desc>
<defs>
<marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#5473ad" /></marker>
<marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#b47b31" /></marker>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#243247}.title{font-size:36px;font-weight:750}.subtitle{font-size:19px;fill:#607188}.section{font-size:20px;font-weight:750;letter-spacing:.5px}.section-note{font-size:16px;fill:#5c6f85}.card-title{font-size:19px;font-weight:700}.body{font-size:17px;fill:#3d4f66}.small{font-size:15px;fill:#596b80}.tiny{font-size:13px;fill:#66778c}.key{font-size:12px;font-weight:700;fill:#fff}</style>
