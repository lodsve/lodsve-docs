<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }} 文档</title>
  <link rel="canonical" href="{{ .Permalink }}">
  {{ $style := resources.Get "css/site.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  {{ $organization := resources.Get "css/organization.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $organization.RelPermalink }}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到正文</a>
  {{ partial "header.html" . }}
  <main id="main-content" class="site-main">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
