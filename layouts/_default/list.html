{{ define "main" }}
<div class="docs-shell">
  <aside class="docs-sidebar"><a class="back-home" href="{{ "/" | relURL }}">← 返回首页</a>{{ partial "sidebar.html" . }}</aside>
  <article class="doc-content">
    <div class="eyebrow">文档目录</div>
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="lead">{{ . }}</p>{{ end }}
    {{ .Content }}
    <div class="doc-grid">{{ range .Pages.ByWeight }}<a class="doc-card" href="{{ .RelPermalink }}"><span class="card-kicker">{{ .Params.kicker | default "文档" }}</span><strong>{{ .Title }}</strong><span>{{ .Params.description }}</span></a>{{ end }}</div>
  </article>
</div>
{{ end }}
