{{ define "main" }}
<div class="docs-shell">
  {{ partial "doc-sidebar.html" . }}
  {{ partial "doc-toc.html" . }}
  <article class="doc-content">
    {{ partial "doc-heading.html" . }}
    {{ .Content }}
    <div class="doc-grid">{{ range .Pages.ByWeight }}<a class="doc-card" href="{{ .RelPermalink }}"><span class="card-kicker">{{ .Params.kicker | default (T "docs") }}</span><strong>{{ .Title }}</strong><span>{{ .Params.description }}</span></a>{{ end }}</div>
  </article>
</div>
{{ end }}
